name: Energy Brain EMS
slug: energy_brain
description: Deterministisch, fysisch bewust energiemanagementsysteem voor Home Assistant
version: "0.8.81"
arch:
  - amd64
  - aarch64

startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true



options:
  mode: observer

  cycle_seconds: 900
  horizon_steps: 96

  ui_profile: tablet

  battery_soc_entity: ""
  pv_power_entity: ""
  grid_price_entity: ""
  household_load_entity: ""

  battery_capacity_kwh: 10

  soc_min_percent: 10
  soc_max_percent: 95
  reserve_percent: 20

  max_charge_kw: 5
  max_discharge_kw: 5

  charge_efficiency: 95
  discharge_efficiency: 95

  command_service_domain: ""
  command_service: ""
  command_value_field: ""

  hillview_controls_enabled: true

schema:
  mode: list(observer|shadow|active)

  cycle_seconds: int
  horizon_steps: int

  ui_profile: str

  battery_soc_entity: str
  pv_power_entity: str
  grid_price_entity: str
  household_load_entity: str

  battery_capacity_kwh: int

  soc_min_percent: int
  soc_max_percent: int
  reserve_percent: int

  max_charge_kw: int
  max_discharge_kw: int

  charge_efficiency: int
  discharge_efficiency: int

  command_service_domain: str
  command_service: str
  command_value_field: str

  hillview_controls_enabled: bool

# Energy Brain alleen-lezen web UI
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Energy Brain alleen-lezen web UI"
webui: "http://[HOST]:[PORT:8099]/"
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: "Energy Brain"
