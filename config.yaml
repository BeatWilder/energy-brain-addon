name: Energy Brain EMS
slug: energy_brain
description: Deterministisch, fysisch bewust energiemanagementsysteem voor Home Assistant
version: "0.8.45"
arch:
  - amd64
  - aarch64

startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true

options:
  mode: observer
  cycle_seconds: 900
  horizon_steps: 96

  battery_soc_entity: ""
  pv_power_entity: ""
  grid_price_entity: ""
  household_load_entity: ""

  battery_capacity_kwh: 10.0
  soc_min_percent: 10.0
  soc_max_percent: 95.0
  reserve_percent: 20.0

  max_charge_kw: 5.0
  max_discharge_kw: 5.0

  charge_efficiency: 0.95
  discharge_efficiency: 0.95

  command_service_domain: ""
  command_service: ""
  command_value_field: ""

  hillview_controls_enabled: false

schema:
  mode: list(observer|shadow|active)
  cycle_seconds: int(60,3600)
  horizon_steps: int(1,192)

  battery_soc_entity: str
  pv_power_entity: str
  grid_price_entity: str
  household_load_entity: str

  battery_capacity_kwh: float
  soc_min_percent: float
  soc_max_percent: float
  reserve_percent: float

  max_charge_kw: float
  max_discharge_kw: float

  charge_efficiency: float
  discharge_efficiency: float

  command_service_domain: str
  command_service: str
  command_value_field: str

  hillview_controls_enabled: bool

# Energy Brain alleen-lezen web UI
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Energy Brain alleen-lezen web UI"
webui: "http://[HOST]:[PORT:8099]/"
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: "Energy Brain"
